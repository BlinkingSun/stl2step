name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# NOTE: This workflow is provided as a starting point. Linux and macOS install
# OpenCASCADE from system package managers and are fast. Windows builds OCCT via
# vcpkg, which can take a long time on a cold cache.

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the gate suite builds the canonical baseline from a
          # pinned ancestor commit; a shallow clone makes build_baseline.sh
          # fail (git exit 128) and G0.1/G0.3 lose their twin comparison.
          fetch-depth: 0
      - name: Install OpenCASCADE + toolchain
        # libtbb-dev: Ubuntu's OCCT CMake config links TBB by absolute .so path
        # but the libocct-*-dev packages don't pull in the TBB dev package.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libtbb-dev \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
                   -DSTL2STEP_BUILD_EXAMPLES=ON -DSTL2STEP_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the gate suite builds the canonical baseline from a
          # pinned ancestor commit; a shallow clone makes build_baseline.sh
          # fail (git exit 128) and G0.1/G0.3 lose their twin comparison.
          fetch-depth: 0
      - name: Install OpenCASCADE
        run: brew install opencascade
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
                   -DSTL2STEP_BUILD_EXAMPLES=ON -DSTL2STEP_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the gate suite builds the canonical baseline from a
          # pinned ancestor commit; a shallow clone makes build_baseline.sh
          # fail (git exit 128) and G0.1/G0.3 lose their twin comparison.
          fetch-depth: 0
      - name: Install OpenCASCADE (vcpkg)
        run: vcpkg install opencascade
      - name: Configure
        run: cmake -S . -B build
                   -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
                   -DSTL2STEP_BUILD_EXAMPLES=ON -DSTL2STEP_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
